<svg xmlns="http://www.w3.org/2000/svg" width="120" height="20" viewBox="0 0 120 20" role="img" aria-labelledby="title">
  <title id="title">Code license: MIT</title>
  <clipPath id="rounded"><rect width="120" height="20" rx="3"/></clipPath>
  <g clip-path="url(#rounded)">
    <rect width="80" height="20" fill="#162330"/>
    <rect x="80" width="40" height="20" fill="#92d7ce"/>
  </g>
  <g font-family="Verdana,Arial,sans-serif" font-size="11" text-anchor="middle">
    <text x="40" y="14" fill="#edf3f7">Code license</text>
    <text x="100" y="14" fill="#162330">MIT</text>
  </g>
</svg>
