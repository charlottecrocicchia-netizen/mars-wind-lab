[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marswind-lab"
version = "0.5.0"
description = "Reproducible Martian wind diagnostics using the official MCD 6.1 sampler"
requires-python = ">=3.11"
dependencies = ["numpy>=2", "scipy>=1.13", "xarray>=2024.1", "netCDF4>=1.7", "matplotlib>=3.9", "fastapi>=0.115", "uvicorn>=0.30", "imageio-ffmpeg>=0.6"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
research = ["Markdown>=3.7"]
observations = ["pyshtools>=4.14,<5", "openpyxl>=3.1", "shapely>=2.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["integration: requires the local MCD installation"]
